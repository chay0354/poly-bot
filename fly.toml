# Worker in Amsterdam: Polymarket's CLOB front door is London.
# Do not switch this to a US region — Polymarket geoblocks US IPs.
#
# No [http_service]: Fly creates two machines for "high availability" for
# any process with a service, and two bots would trade the same wallet.
# Without a service there is one machine and nothing auto-stops it.
app = "poly-bot-gvdobw"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
