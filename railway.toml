# Railway worker: long-running python loop (not a web app / not Vercel).
# Set PM_* variables in the Railway dashboard. Never put PM_PRIVATE_KEY in git.
#
# Favorite phase (Sep 2026) — the dashboard variables must be:
#   PM_MODE=live
#   PM_ASSET=btc
#   PM_MAKER=false  PM_MOMENTUM=false  PM_ARB=false  PM_SNIPE=false
#   PM_FAVORITE=true
#   PM_FAVORITE_STAKE_USDC=20
#   PM_FAVORITE_TRIGGER=0.88  PM_FAVORITE_MAX=0.95  PM_FAVORITE_HOLD=1
#   PM_FAVORITE_STOP=0.50  PM_FAVORITE_TAPE=true  PM_FAVORITE_TAPE_USD=5
#   PM_DAILY_LOSS_LIMIT=40     one $20 fill that dies is −$20; 3 is one trade
# Stop any local live copy first or two bots will trade the same wallet.
# Railway's config-as-code has no variables section, so this is a checklist,
# not enforcement. `run.py` logs the effective flags at start — read them.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -u run.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Region is set in the dashboard (Settings → Deploy → Regions), not here.
# Do NOT use US East: Polymarket rejects US IPs (403 geoblock). Their
# primary CLOB is eu-west-2; closest allowed Railway region is EU West
# (Netherlands — API is open). Stop any local live copy first.
